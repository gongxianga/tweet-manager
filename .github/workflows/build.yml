name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller anthropic

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "推文管理工具" tweet_manager_gui.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "推文管理工具 v1.0.${{ github.run_number }}"
          body: |
            ## 下载说明
            1. 下载 `推文管理工具.exe`
            2. 双击运行（无需安装 Python）
            3. 首次使用请在「设置」页面配置 X Cookie 和 Claude API Key
          files: dist/推文管理工具.exe
